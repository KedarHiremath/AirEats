{% extends 'core/base.html' %}
{% load static %}

{% block title %}Payment - AirEats{% endblock %}

{% block content %}
<div class="payment-container">
    <h2>Payment for Booking {{ booking.booking_id }}</h2>
    <p><strong>Total Amount:</strong> ₹{{ booking.amount }}</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post" class="payment-form">
        {% csrf_token %}
        <div class="payment-options">
            <label class="payment-tile">
                <input type="radio" name="payment_method" value="UPI">
                <img src="{% static 'core/images/payment/upi.jpg' %}" alt="UPI">
                <span>UPI</span>
            </label>
            <label class="payment-tile">
                <input type="radio" name="payment_method" value="Card">
                <img src="{% static 'core/images/payment/card.jpg' %}" alt="Card">
                <span>Card</span>
            </label>
            <label class="payment-tile">
                <input type="radio" name="payment_method" value="Net Banking">
                <img src="{% static 'core/images/payment/netbanking.jpg' %}" alt="Net Banking">
                <span>Net Banking</span>
            </label>
            <label class="payment-tile">
                <input type="radio" name="payment_method" value="Cash">
                <img src="{% static 'core/images/payment/cash.jpg' %}" alt="Cash">
                <span>Cash</span>
            </label>
        </div>

        <button type="submit" class="pay-btn">Make Payment</button>
    </form>
</div>
{% endblock %}
