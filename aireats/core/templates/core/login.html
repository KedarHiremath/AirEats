{% extends 'core/base.html' %}
{% load static %}

{% block title %}Login - AirEats{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <img src="{% static 'core/images/logo.png' %}" alt="AirEats Logo">
        </div>
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Login to continue your journey with AirEats</p>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="post" action="{% url 'login_page' %}">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="identifier" placeholder="Username / Email / Phone" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="signup-text">
            Don’t have an account? <a href="{% url 'signup_page' %}">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
